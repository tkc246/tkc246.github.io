<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Zen+Kaku+Gothic+New:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body { display: grid; place-items: center; font-size: var(--u); }
  body.bg {
    background:
      radial-gradient(60% 90% at 78% -10%, rgba(255,200,121,.20), transparent 70%),
      radial-gradient(70% 90% at 0% 110%, rgba(20,18,15,.9), transparent 70%),
      linear-gradient(160deg, #3D3934, #26231F);
  }
  body.bg::after { content: ""; position: fixed; inset: 0; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .lock { display: flex; flex-direction: column; align-items: flex-start; }
  .wm { font-family: "Outfit"; font-weight: 900; font-size: 1em; line-height: .92; letter-spacing: -.05em; color: #F6F0E6; padding-right: .05em; white-space: nowrap; }
  .wm .hy { color: #FFC879; text-shadow: 0 0 .12em rgba(255,200,121,.45); }
  .catch { font-family: "Zen Kaku Gothic New"; font-weight: 700; font-size: .2em; letter-spacing: .12em; color: #F6F0E6; margin-top: .9em; padding-left: .12em; white-space: nowrap; }
</style>
<body><div class="lock"><div class="wm">tkc<span class="hy">-</span>works</div><div class="catch">つくることで、もっと楽しく。</div></div></body>
